name: Daily arXiv Assistant

on:
  schedule:
    # Runs at 03:30 UTC every day, which is 09:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows you to manually click a "Run workflow" button

jobs:
  run-arxiv-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for keepalive commit

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run arXiv Assistant
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        SMTP_SERVER: smtp.gmail.com
        SMTP_PORT: 587
      run: python arxiv_assistant.py

    - name: Keepalive — prevent GitHub from disabling this workflow
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        date -u > .last_run
        git add .last_run
        git diff --cached --quiet || git commit -m "keepalive: $(date -u +'%Y-%m-%d')"
        git push
